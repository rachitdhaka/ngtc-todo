# CodeDeploy (EC2) - pipeline stage: Deploy
#
# The server keeps a git clone of the repo at /home/ubuntu/ngtc-todo, with its
# own .env (secrets, never in git). Each deployment moves that clone to the
# exact commit that passed the Build and Test stages, then rebuilds and restarts:
#   AfterInstall     deploy/update.sh    git fetch + fast-forward to the tested commit
#   ApplicationStart deploy/start.sh     docker compose up -d --build
#   ValidateService  deploy/validate.sh  wait until healthy, else fail the deployment
version: 0.0
os: linux

files:
  # Only the release marker is copied; the code comes from the git clone.
  - source: RELEASE
    destination: /opt/ngtc-todo
file_exists_behavior: OVERWRITE

hooks:
  AfterInstall:
    - location: deploy/update.sh
      timeout: 300
      runas: ubuntu
  ApplicationStart:
    - location: deploy/start.sh
      timeout: 1800
      runas: ubuntu
  ValidateService:
    - location: deploy/validate.sh
      timeout: 300
      runas: ubuntu
